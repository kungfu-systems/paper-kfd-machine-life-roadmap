name: Build

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - "dev/**"
      - "alpha/**"
      - "release/**"

permissions:
  contents: read
  issues: write

jobs:
  publication:
    uses: kungfu-systems/buildchain/.github/workflows/publication-artifact.yml@60ac9ca28dc0cc7a06945b45b06f22507c510145
    with:
      buildchain-ref: 60ac9ca28dc0cc7a06945b45b06f22507c510145
      buildchain-contract-lock-path: .buildchain/contract-lock.json
      toolchain-type: config
      verify-command: make check
      artifact-name: "paper-kfd-machine-life-roadmap"
