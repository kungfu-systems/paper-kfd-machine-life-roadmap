name: Paper Release

on:
  push:
    branches:
      - "alpha/v*/v*.*"
      - "release/v*/v*.*"
  workflow_dispatch:
    inputs:
      buildchain-ref:
        description: "Temporary Buildchain runtime ref for trusted manual validation"
        required: false
        default: ""

jobs:
  paper-release:
    uses: kungfu-systems/buildchain/.github/workflows/paper-release.yml@v3
    permissions:
      contents: write
      id-token: write
      issues: write
    with:
      buildchain-ref: ${{ inputs['buildchain-ref'] || (startsWith(github.ref_name, 'alpha/') && 'v3-alpha' || 'v3') }}
      buildchain-contract-lock-path: ${{ startsWith(github.ref_name, 'alpha/') && '.buildchain/alpha-contract-lock.json' || '.buildchain/contract-lock.json' }}
      toolchain-type: config
      verify-command: make check
      artifact-name: paper-kfd-machine-life-roadmap
      release-passport-product-name: Semantic Autopoiesis
