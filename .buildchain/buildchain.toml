schema = 1

[project]
type = "publication-artifact"
name = "paper-kfd-machine-life-roadmap"

[publication]
kind = "paper"
title = "Semantic Autopoiesis: An Engineering Roadmap for Machine Life"
version = "0.1.0-alpha.9"
abstract = "A functional and falsifiable engineering roadmap for a low-level machine organism built from semantic continuity, replaceable agents, executable organs, ordinary computing infrastructure, and governed self-modification."
authors = ["Keren Dong"]
primary_artifact = "_build/main.pdf"
artifact_paths = ["_build/main.pdf"]
metadata_paths = ["README.md", "docs/MAP.md", "site/brand-site.json", "site/site-bundles.json"]
source_paths = ["paper", "README.md", "LICENSE", "Makefile", "scripts", "site"]
site_consumers = ["kungfu.tech", "papers.libkungfu.dev"]
manifest_path = ".buildchain/publication/publication-artifact.json"
source_bundle_path = ".buildchain/publication/source.tar.gz"

[publication.archive]
id = "kfd-machine-life-roadmap"
canonical_url = "https://papers.libkungfu.dev/kfd-machine-life-roadmap/"
latest_url = "https://papers.libkungfu.dev/kfd-machine-life-roadmap/latest/"
latest_evidence_url = "https://papers.libkungfu.dev/kfd-machine-life-roadmap/latest/buildchain.release.json"
immutable_base_url = "https://papers.libkungfu.dev/archive"
registry_path = ".buildchain/publication/publication-registry.json"

[publication.toolchain]
type = "latex-docker"
image = "ghcr.io/kungfu-systems/build-images/latex-pdf-builder"
digest = "sha256:5ae0e5211ade2937b17a76502a4fd2bcecc5220bd10086ffe9739d5dbbc18d38"
command = "mkdir -p _build && cd paper && latexmk -pdf -outdir=../_build main.tex"

[publish]
kind = "npm-paper-package"
package = "@kungfu-tech/paper-kfd-machine-life-roadmap"
auth = "trusted-publishing"

[version]
required = true

[[version.files]]
type = "toml"
path = ".buildchain/buildchain.toml"
key = "publication.version"

[lifecycle.install]
command = "true"

[lifecycle.verify]
command = "make check"
